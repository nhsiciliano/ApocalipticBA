packages:
  - apps/*
  - packages/*
  - tools/*
  - supabase

# pnpm 11+ solo lee auth/registry desde .npmrc: el resto de la config vive acá.
engineStrict: true
autoInstallPeers: true

# Scripts de build de dependencias: lista explícita (todo lo no listado falla la instalación).
allowBuilds:
  # Solo verifica el binario nativo, que ya viene como paquete opcional por plataforma.
  unrs-resolver: false
  # eas-cli → bunyan → dtrace-provider: el binario es opcional y el fallback en JS alcanza.
  dtrace-provider: false
  # eas-cli → protobufjs: el postinstall solo genera stubs opcionales de TypeScript.
  protobufjs: false
